spring:
  application:
    name: support-ticket-ai
  datasource:
    url: jdbc:postgresql://localhost:5432/support_ticket_ai
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  flyway:
    enabled: false

server:
  port: 8080

rag:
  retrieval:
    top-k: 5
    similarity-threshold: 0.72
  chunk:
    max-tokens: 512
    overlap-tokens: 64
    version: section-v1
  embedding:
    provider: ollama
    base-url: http://localhost:11434
    model: nomic-embed-text
    dimension: 768
  generation:
    base-url: http://localhost:11434
    model: llama3.2