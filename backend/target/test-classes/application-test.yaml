spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:support_ticket_ai;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  sql:
    init:
      mode: always

rag:
  retrieval:
    top-k: 5
    similarity-threshold: 0.72
  chunk:
    max-tokens: 512
    overlap-tokens: 64
    version: section-v1
  embedding:
    provider: test
    base-url: http://localhost:11434
    model: nomic-embed-text
    dimension: 768
  generation:
    base-url: http://localhost:11434
    model: llama3.2